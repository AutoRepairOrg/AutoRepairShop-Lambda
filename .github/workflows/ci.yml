name: CI - Lambda

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore Login Lambda
      working-directory: ./src/AutoRepairShop.Login
      run: dotnet restore

    - name: Build Login Lambda
      working-directory: ./src/AutoRepairShop.Login
      run: dotnet build --configuration Release --no-restore

    - name: Restore Authorizer Lambda
      working-directory: ./src/AutoRepairShop.Authorizer
      run: dotnet restore

    - name: Build Authorizer Lambda
      working-directory: ./src/AutoRepairShop.Authorizer
      run: dotnet build --configuration Release --no-restore

    - name: Run Tests
      run: |
        if [ -d "tests" ]; then
          dotnet test --no-build --verbosity normal
        else
          echo "⚠️ No tests found, skipping..."
        fi

    - name: Print build success
      run: echo "✅ Lambda functions build passed!"

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.6

    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Init
      run: terraform init -backend=false

    - name: Terraform Validate
      run: terraform validate

    - name: Print validation success
      run: echo "✅ Terraform validation passed!"
