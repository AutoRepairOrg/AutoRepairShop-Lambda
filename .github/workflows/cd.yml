name: CD - Deploy Lambda Functions and API Gateway

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'terraform/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build Login Lambda
        working-directory: ./src/AutoRepairShop.Login
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Package Login Lambda
        working-directory: ./src/AutoRepairShop.Login/publish
        run: |
          zip -r ../../../login-lambda.zip .

      - name: Restore and Build Authorizer Lambda
        working-directory: ./src/AutoRepairShop.Authorizer
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Package Authorizer Lambda
        working-directory: ./src/AutoRepairShop.Authorizer/publish
        run: |
          zip -r ../../../authorizer-lambda.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -input=false

      - name: Import existing JWT Secret
        working-directory: ./terraform
        env:
          AWS_REGION: us-east-1
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if ! terraform state list | grep -qx 'aws_secretsmanager_secret.jwt_secret'; then
            if aws secretsmanager describe-secret --secret-id autorepair/jwt-secret --region "$AWS_REGION" >/dev/null 2>&1; then
              SECRET_ARN=$(aws secretsmanager describe-secret \
                --secret-id autorepair/jwt-secret \
                --region "$AWS_REGION" \
                --query ARN \
                --output text)

              terraform import \
                -input=false \
                aws_secretsmanager_secret.jwt_secret \
                "$SECRET_ARN"
            fi
          fi

      - name: Import existing API Gateway
        working-directory: ./terraform
        env:
          AWS_REGION: us-east-1
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if ! terraform state list | grep -qx 'aws_api_gateway_rest_api.autorepair_api'; then
            API_ID=$(aws apigateway get-rest-apis \
              --region "$AWS_REGION" \
              --query "items[?name=='autorepair-api'].id" \
              --output text)

            if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
              echo "Importing existing API Gateway: $API_ID"
              terraform import \
                -input=false \
                aws_api_gateway_rest_api.autorepair_api \
                "$API_ID"
            fi
          fi

      - name: Terraform Format Check
        working-directory: ./terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate

      - name: Check JWT secret
        env:
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$TF_VAR_jwt_secret_key" ]; then
            echo "ERRO: JWT_SECRET_KEY não foi encontrada no GitHub."
            exit 1
          fi
          echo "JWT_SECRET_KEY encontrada."

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          terraform plan -no-color -input=false

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          terraform apply -auto-approve -input=false

      - name: Show Terraform Outputs
        working-directory: ./terraform
        run: |
          terraform output

      - name: Show API Gateway URL
        working-directory: ./terraform
        run: |
          echo "========================================"
          echo "API Gateway"
          echo "========================================"
          terraform output -raw login_url || true
          echo
          terraform output -raw api_proxy_url || true
          echo
          terraform output -raw health_url || true
          echo
          echo "========================================"

      - name: Show Lambda packages
        run: |
          echo "Lambda packages:"
          ls -lh login-lambda.zip authorizer-lambda.zip
