name: CD - Deploy Lambda Functions and API Gateway

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'terraform/**'
      - '.github/workflows/cd.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ======================================================
      # LOGIN LAMBDA
      # ======================================================

      - name: Restore and Build Login Lambda
        working-directory: ./src/AutoRepairShop.Login
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Package Login Lambda
        working-directory: ./src/AutoRepairShop.Login/publish
        run: |
          zip -r ../../../login-lambda.zip .

      # ======================================================
      # AUTHORIZER LAMBDA
      # ======================================================

      - name: Restore and Build Authorizer Lambda
        working-directory: ./src/AutoRepairShop.Authorizer
        run: |
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Package Authorizer Lambda
        working-directory: ./src/AutoRepairShop.Authorizer/publish
        run: |
          zip -r ../../../authorizer-lambda.zip .

      # ======================================================
      # AWS
      # ======================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # ======================================================
      # TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -no-color

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve

      # ======================================================
      # OUTPUTS
      # ======================================================

      - name: Show Terraform Outputs
        working-directory: ./terraform
        run: |
          terraform output

      - name: Show API Gateway URL
        run: |
          API_ID=$(aws apigateway get-rest-apis \
            --query "items[?name=='autorepair-api'].id" \
            --output text)

          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            echo "========================================"
            echo "API Gateway criado com sucesso"
            echo "========================================"
            echo "API Gateway ID: $API_ID"
            echo ""
            echo "Login:"
            echo "https://${API_ID}.execute-api.us-east-1.amazonaws.com/prod/auth/login"
            echo ""
            echo "API:"
            echo "https://${API_ID}.execute-api.us-east-1.amazonaws.com/prod/api/"
            echo "========================================"
          else
            echo "API Gateway não encontrado"
            exit 1
          fi

      - name: Show Lambda packages
        run: |
          echo "Lambda packages:"
          ls -lh login-lambda.zip authorizer-lambda.zip
