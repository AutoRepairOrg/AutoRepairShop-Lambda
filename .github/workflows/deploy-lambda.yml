name: Deploy Lambda Functions

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore Login
      working-directory: ./src/AutoRepairShop.Login
      run: dotnet restore
    
    - name: Build and Publish Login
      working-directory: ./src/AutoRepairShop.Login
      run: dotnet publish -c Release -o publish
    
    - name: Package Login Lambda
      working-directory: ./src/AutoRepairShop.Login/publish
      run: zip -r ../../../login-lambda.zip .
    
    - name: Restore Authorizer
      working-directory: ./src/AutoRepairShop.Authorizer
      run: dotnet restore
    
    - name: Build and Publish Authorizer
      working-directory: ./src/AutoRepairShop.Authorizer
      run: dotnet publish -c Release -o publish
    
    - name: Package Authorizer Lambda
      working-directory: ./src/AutoRepairShop.Authorizer/publish
      run: zip -r ../../../authorizer-lambda.zip .
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1
    
    - name: Deploy Login Lambda
      run: |
        aws lambda update-function-code \
          --function-name autorepair-login \
          --zip-file fileb://login-lambda.zip
    
    - name: Deploy Authorizer Lambda
      run: |
        aws lambda update-function-code \
          --function-name autorepair-authorizer \
          --zip-file fileb://authorizer-lambda.zip
